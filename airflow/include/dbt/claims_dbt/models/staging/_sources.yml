version: 2

sources:
  - name: raw
    database: CLAIMS_DWH
    schema: RAW
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
    tables:
      - name: claims
      - name: providers
      - name: members
      - name: claim_keys
        config:
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 30, period: hour}