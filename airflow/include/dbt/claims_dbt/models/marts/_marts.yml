version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fct_claims
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RECEIVED', 'PENDED', 'ADJUDICATED', 'PAID', 'DENIED', 'CLOSED']
      - name: date_received_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: member_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: provider_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id
      - name: member_key
        data_tests: [not_null]		
      - name: provider_key
        data_tests: [not_null]