<text x="312" y="100" font-size="14" font-weight="700" fill="#C2410C" text-anchor="start">ORCHESTRATION: Airflow 3.3 (Astro CLI, Docker), DAG claims_pipeline, daily</text>
<text x="312" y="119" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="start">extract_rows, then extract_keys, then load_raw (COPY INTO), then dbt_build (snapshots, models, tests); retries; max one active run</text>
