<rect width="1440" height="790" fill="#ffffff"/>
<text x="24" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Claims data warehouse: architecture</text>
<text x="24" y="62" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">All data is synthetic. Everything shown is built and running, except the dashed Consumers box.</text>
