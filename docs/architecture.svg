<text x="324" y="297" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">MIN_ACTIVE_ROWVERSION()</text>
<text x="324" y="314" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">writes Parquet in chunks</text>
<rect x="312" y="385" width="200" height="118" rx="9" fill="#ffffff" stroke="#C98A1B" stroke-width="1.4"/>
