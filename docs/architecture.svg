<text x="52" y="555" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">seed, then tick: insert,</text>
<text x="52" y="572" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">update, delete</text>
